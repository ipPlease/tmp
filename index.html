<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>向日葵’s 星座</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;position:fixed;inset:0}
#c{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
.serif{font-family:"Songti TC","Noto Serif TC","Noto Serif CJK TC","Source Han Serif TC","PMingLiU","MingLiU","Songti SC",Georgia,"Times New Roman",serif}
#load{position:absolute;inset:0;background:#000;transition:opacity 1.6s ease;pointer-events:none;z-index:5}
#load i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff3d6;box-shadow:0 0 8px 2px rgba(255,214,150,.55);opacity:0;animation:tw 2.4s ease-in-out infinite}
#load u{position:absolute;width:1.5px;height:1.5px;border-radius:50%;background:#dfe9ff;opacity:.5}
#load b{position:absolute;left:50%;top:50%;width:46vmin;height:46vmin;margin:-23vmin 0 0 -23vmin;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,190,110,.20),rgba(40,120,130,.08) 55%,rgba(0,0,0,0) 100%);animation:br 3.2s ease-in-out infinite}
#load.wide b{width:120vmin;height:120vmin;margin:-60vmin 0 0 -60vmin;background:radial-gradient(closest-side,rgba(255,190,110,.13),rgba(40,120,130,.07) 50%,rgba(0,0,0,0) 100%)}
@keyframes tw{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:.95;transform:scale(1)}}
@keyframes br{0%,100%{opacity:.45;transform:scale(.92)}50%{opacity:1;transform:scale(1.06)}}
#title{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;opacity:0;pointer-events:none;
  font-size:clamp(21px,3.2vmin + 9px,40px);line-height:2.3;letter-spacing:.5em;padding:6vmin 0 6vmin .5em;font-weight:500;color:#fff8e8;
  text-shadow:0 0 2px rgba(0,0,0,.95),0 0 10px rgba(0,0,0,.9),0 0 26px rgba(0,0,0,.8),0 0 60px rgba(0,0,0,.6);z-index:3;
  background:radial-gradient(ellipse 46% 50% at 50% 50%,rgba(0,0,0,.62),rgba(0,0,0,.42) 45%,rgba(0,0,0,0) 100%)}
#title.latin{letter-spacing:.16em;padding-left:.16em;line-height:1.9}
button{font:inherit;color:#f3e6cc;background:rgba(8,10,14,.38);border:1px solid rgba(243,226,190,.42);border-radius:999px;outline:none;cursor:pointer;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);touch-action:none;-webkit-user-select:none;user-select:none;padding:0;margin:0}
#skip{position:absolute;right:calc(18px + env(safe-area-inset-right));top:calc(16px + env(safe-area-inset-top));font-size:13px;letter-spacing:.35em;
  padding:8px 12px 8px 17px;opacity:.72;z-index:4;display:none}
#start{position:absolute;left:50%;bottom:calc(7vh + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:clamp(15px,1.4vmin + 8px,20px);
  letter-spacing:.5em;padding:13px 22px 13px 31px;opacity:0;transition:opacity 1.2s ease;z-index:4;display:none;box-shadow:0 0 24px rgba(255,205,130,.18);white-space:nowrap}
.en #start,.en #skip{letter-spacing:.18em;padding-left:22px}.en #skip{padding-left:14px}
#legend{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));text-align:center;color:rgba(240,228,205,.62);font-size:12px;
  letter-spacing:.14em;pointer-events:none;display:none;z-index:3;text-shadow:0 0 6px #000}
#legend span{margin:0 .7em;white-space:nowrap}
@media (max-aspect-ratio:1/1){#start{bottom:calc(140px + env(safe-area-inset-bottom))}}
#touch{position:absolute;inset:0;display:none;z-index:3;pointer-events:none;opacity:0;transition:opacity 1.2s ease}
#stick{position:absolute;left:calc(22px + env(safe-area-inset-left));bottom:calc(26px + env(safe-area-inset-bottom));width:124px;height:124px;border-radius:50%;
  border:1px solid rgba(243,226,190,.34);background:rgba(8,10,14,.22);pointer-events:auto}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(243,226,190,.30);border:1px solid rgba(243,226,190,.5)}
.tb{position:absolute;pointer-events:auto;width:64px;height:64px;font-size:13px;letter-spacing:.08em;line-height:1.2}
.en .tb{font-size:11px;letter-spacing:.02em}
.tb.on{background:rgba(243,226,190,.30)}
#bUp{right:calc(20px + env(safe-area-inset-right));bottom:calc(100px + env(safe-area-inset-bottom))}
#bDown{right:calc(20px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom))}
#bBoost{right:calc(94px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom))}
#bFront{right:calc(20px + env(safe-area-inset-right));top:calc(16px + env(safe-area-inset-top));width:76px;height:44px}
#bSound{right:calc(106px + env(safe-area-inset-right));top:calc(16px + env(safe-area-inset-top));width:60px;height:44px}
#bColor{right:calc(176px + env(safe-area-inset-right));top:calc(16px + env(safe-area-inset-top));width:60px;height:44px}
#post{position:absolute;left:calc(16px + env(safe-area-inset-left));top:calc(16px + env(safe-area-inset-top));z-index:4;display:none;opacity:0;transition:opacity 1.2s ease}
#post button{font-size:13px;letter-spacing:.2em;padding:9px 14px 9px 16px;margin-right:8px;opacity:.86;touch-action:manipulation}
.en #post button{letter-spacing:.06em;padding:9px 14px}
.touch #post{top:calc(68px + env(safe-area-inset-top))}
.touch #post button{min-height:40px}
#dbg{position:absolute;left:calc(8px + env(safe-area-inset-left));top:calc(64px + env(safe-area-inset-top));margin:0;color:#9fd;font:11px/1.35 ui-monospace,Menlo,monospace;
  background:rgba(0,0,0,.5);padding:4px 6px;display:none;z-index:6;pointer-events:none;white-space:pre}
/* ---- tool screens (pick, mark, wait). They sit over the starry loading layer. */
.screen{position:absolute;inset:0;z-index:7;display:none;color:#f3e6cc}
#lang{position:absolute;right:calc(16px + env(safe-area-inset-right));top:calc(14px + env(safe-area-inset-top));z-index:9;font-size:12px;letter-spacing:.1em;padding:7px 12px;opacity:.75;display:none;touch-action:manipulation}
#pick{align-items:center;justify-content:center;text-align:center}
#pick .in{max-width:min(86vw,560px);padding:0 4vw}
#pick h1{font-weight:500;font-size:clamp(28px,4.4vmin + 12px,54px);letter-spacing:.42em;padding-left:.42em;margin:0 0 .5em;color:#fff3da;text-shadow:0 0 28px rgba(255,200,120,.35)}
.en #pick h1{letter-spacing:.14em;padding-left:.14em}
#pick p{margin:0;line-height:1.9;letter-spacing:.16em;font-size:clamp(13px,1vmin + 9px,17px);color:rgba(243,230,204,.78)}
.en #pick p{letter-spacing:.04em}
#pkBtn{margin:2.4em 0 1.1em;font-size:clamp(16px,1.4vmin + 9px,21px);letter-spacing:.42em;padding:15px 28px 15px 38px;box-shadow:0 0 30px rgba(255,205,130,.22);border-color:rgba(255,222,170,.6);touch-action:manipulation}
.en #pkBtn{letter-spacing:.12em;padding:15px 30px}
#pick .hint{font-size:12.5px;color:rgba(243,230,204,.5)}
#pick .priv{margin-top:2.6em;font-size:12.5px;color:rgba(190,225,225,.62)}
#pick .err{margin-top:1em;font-size:13px;color:#ffb69a;min-height:1.9em}
#pick.drop .in{outline:1px dashed rgba(255,222,170,.55);outline-offset:28px;border-radius:18px}
#mark{flex-direction:column;align-items:stretch;padding-top:calc(50px + env(safe-area-inset-top));box-sizing:border-box}
#mkSide{display:contents}
#mkGuide{order:1;flex:0 0 auto;margin:0 12px 8px}
#mkStage{order:2}#mkPanel{order:3}
#mkStage{flex:1 1 auto;position:relative;min-height:0;margin:0 10px}
#mkWrap{position:absolute;box-shadow:0 0 0 1px rgba(243,226,190,.28),0 0 46px rgba(255,200,120,.12);border-radius:3px;overflow:hidden;touch-action:none;cursor:crosshair}
#mkWrap canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#mkMask{opacity:.5}
#mkPanel{flex:0 0 auto;padding:9px 10px calc(11px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;align-items:center}
.row{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;align-items:center;max-width:760px;width:100%}
.tool{font-size:13.5px;letter-spacing:.14em;padding:9px 13px 9px 15px;min-height:40px;min-width:52px;touch-action:manipulation}
.en .tool{letter-spacing:.03em;padding:9px 13px}
.tool.on{background:rgba(255,214,150,.26);border-color:rgba(255,226,180,.85);color:#fff6e2}
.tool.go{border-color:rgba(255,222,170,.75);box-shadow:0 0 22px rgba(255,205,130,.22);padding-left:22px;padding-right:20px}
.tool.dim{opacity:.6}
#mkSize{-webkit-appearance:none;appearance:none;width:110px;height:26px;background:transparent;margin:0 2px;touch-action:manipulation}
#mkSize::-webkit-slider-runnable-track{height:2px;background:rgba(243,226,190,.45)}
#mkSize::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#f3e2be;margin-top:-8px;border:none}
#mkSize::-moz-range-track{height:2px;background:rgba(243,226,190,.45)}
#mkSize::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#f3e2be;border:none}
.lab{font-size:12px;letter-spacing:.1em;color:rgba(243,230,204,.6)}
#mkTitle{font:inherit;font-size:15px;line-height:1.5;letter-spacing:.12em;color:#fff3da;background:rgba(8,10,14,.5);border:1px solid rgba(243,226,190,.34);border-radius:12px;
  padding:7px 12px;width:min(72vw,360px);height:3.6em;box-sizing:border-box;resize:none;outline:none;text-align:center;-webkit-user-select:text;user-select:text;touch-action:manipulation}
#mkTitle::placeholder{color:rgba(243,230,204,.42)}
#busy{align-items:center;justify-content:center;flex-direction:column;text-align:center;pointer-events:none}
#busyTxt{font-size:clamp(14px,1vmin + 9px,18px);letter-spacing:.3em;padding-left:.3em;color:rgba(255,240,214,.86);margin-top:34vmin}
.en #busyTxt{letter-spacing:.08em}
#bar{width:min(52vw,280px);height:2px;background:rgba(243,226,190,.2);margin-top:18px;border-radius:2px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c98a3a,#ffe2aa);box-shadow:0 0 10px rgba(255,214,150,.8)}
/* ---- wizard: step bar, guide blocks with drawn illustrations, target, overview overlay */
#steps{position:absolute;left:50%;transform:translateX(-50%);top:calc(11px + env(safe-area-inset-top));z-index:9;display:none;gap:6px;align-items:center;white-space:nowrap}
#steps button{font-size:12.5px;letter-spacing:.12em;padding:6px 11px 6px 8px;display:flex;align-items:center;gap:6px;opacity:.42;touch-action:manipulation;min-height:32px}
.en #steps button{letter-spacing:.02em}
#steps button b{display:inline-block;width:18px;height:18px;line-height:18px;border-radius:50%;border:1px solid rgba(243,226,190,.6);font-weight:500;font-size:11px;letter-spacing:0;text-align:center}
#steps button.cur{opacity:1;border-color:rgba(255,226,180,.9);background:rgba(255,214,150,.2);box-shadow:0 0 16px rgba(255,205,130,.25);color:#fff6e2}
#steps button.cur b{background:#f3e2be;color:#17120a;border-color:#f3e2be}
#steps button.done{opacity:.9}#steps button.done b{background:rgba(255,214,150,.25)}
#steps button.avail{opacity:.62}
#steps i{width:14px;height:1px;background:rgba(243,226,190,.35)}
#helpBtn{position:absolute;right:calc(72px + env(safe-area-inset-right));top:calc(14px + env(safe-area-inset-top));z-index:9;font-size:13px;width:30px;height:30px;opacity:.8;display:none;touch-action:manipulation}
.en #helpBtn{right:calc(84px + env(safe-area-inset-right))}
.guide{display:flex;align-items:center;gap:12px;text-align:left}
.guide .il{flex:0 0 auto;width:74px;height:74px}
.il svg{width:100%;height:100%;display:block;overflow:visible}
.guide .do{font-size:clamp(14px,.9vmin + 10px,17px);letter-spacing:.1em;line-height:1.45;color:#fff3da;margin:0}
.guide .why,.guide .skipn{font-size:12.5px;letter-spacing:.06em;line-height:1.5;color:rgba(243,230,204,.72);margin:3px 0 0}
.guide .skipn{color:rgba(190,225,225,.62)}
.en .guide .do,.en .guide .why,.en .guide .skipn{letter-spacing:.01em}
#pkIl{width:104px;height:104px;margin:0 auto 6px}
#pick .why2{font-size:12.5px;color:rgba(243,230,204,.5)}
#mark.s2 .only3,#mark.s3 .only2{display:none}
#mark.s3 #mkMask{opacity:.3}
#mark.s3 #mkWrap{cursor:pointer}
#mkTarget{position:absolute;width:0;height:0;pointer-events:none;display:none;z-index:2}
#mark.s3 #mkTarget{display:block}
#mkTarget i{position:absolute;left:-15px;top:-15px;width:30px;height:30px;border-radius:50%;border:2px solid #ffe9bd;box-sizing:border-box;box-shadow:0 0 0 1.5px rgba(0,0,0,.55),0 0 14px rgba(255,214,150,.8)}
#mkTarget u{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:#fff}
#mkTarget b{position:absolute;left:-15px;top:-15px;width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(255,226,180,.9);box-sizing:border-box;animation:pulse 1.8s ease-out infinite}
#mkTarget b+b{animation-delay:.9s}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.4);opacity:0}}
#help{position:absolute;inset:0;z-index:12;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.84);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);color:#f3e6cc;padding:14px;box-sizing:border-box}
#help h2{font-weight:500;font-size:clamp(17px,1.6vmin + 10px,26px);letter-spacing:.3em;padding-left:.3em;margin:0 0 3vmin;color:#fff3da;text-align:center}
.en #help h2{letter-spacing:.08em;padding-left:.08em}
#cards{display:flex;gap:16px;justify-content:center;align-items:stretch;max-width:1000px;width:100%}
.card{flex:1 1 0;border:1px solid rgba(243,226,190,.26);border-radius:16px;padding:16px 14px;background:rgba(14,13,11,.6);text-align:center;min-width:0}
.card .il{width:118px;height:118px;margin:0 auto 8px}
.card h3{font-weight:500;font-size:16px;letter-spacing:.2em;margin:0 0 8px;color:#ffe9bd}
.en .card h3{letter-spacing:.05em}
.card p{font-size:13px;line-height:1.6;letter-spacing:.06em;margin:0 0 4px;color:rgba(243,230,204,.86)}
.card p.why{color:rgba(243,230,204,.6);font-size:12.5px}
.en .card p{letter-spacing:.01em}
#helpGo{margin-top:3.2vmin;font-size:16px;letter-spacing:.4em;padding:12px 26px 12px 34px;border-color:rgba(255,222,170,.75);box-shadow:0 0 24px rgba(255,205,130,.22);touch-action:manipulation}
.en #helpGo{letter-spacing:.12em;padding:12px 30px}
@media (max-width:700px){
  #steps{left:calc(8px + env(safe-area-inset-left));transform:none;gap:3px}
  #steps i{width:6px}#steps button{padding:6px 8px 6px 6px;letter-spacing:.04em}
  #cards{flex-direction:column;gap:9px;max-width:420px}
  .card{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px}
  .card .il{width:78px;height:78px;margin:0;flex:0 0 auto}
  .card h3{margin-bottom:4px}
  #help h2{margin-bottom:12px}#helpGo{margin-top:14px}
  .guide .il{width:60px;height:60px}
}
@media (min-aspect-ratio:1/1) and (min-width:900px){
  #mark{flex-direction:row;padding-top:0}
  #mkStage{margin:calc(48px + env(safe-area-inset-top)) 10px 16px 16px}
  #mkStage{order:0}
  #mkSide{order:1;display:flex;flex:0 0 320px;flex-direction:column;justify-content:center;gap:22px;padding:20px 14px;box-sizing:border-box}
  #mkGuide{margin:0}
  .guide .il{width:92px;height:92px}
  #mkPanel{padding:0;gap:16px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title" class="serif"></div>
<button id="skip" class="serif" data-i="skip"></button>
<button id="start" class="serif" data-i="start"></button>
<div id="legend" class="serif"></div>
<div id="post" class="serif"><button id="save" data-i="save"></button><button id="again" data-i="again"></button></div>
<div id="touch" class="serif">
  <div id="stick"><div id="knob"></div></div>
  <button class="tb" id="bUp" data-i="bUp"></button>
  <button class="tb" id="bDown" data-i="bDown"></button>
  <button class="tb" id="bBoost" data-i="bBoost"></button>
  <button class="tb" id="bFront" data-i="bFront"></button>
  <button class="tb" id="bColor" data-i="bColor"></button>
  <button class="tb" id="bSound" data-i="bSound"></button>
</div>
<pre id="dbg"></pre>
<div id="load"><b></b></div>
<div id="pick" class="screen serif"><div class="in">
  <div id="pkIl" class="il" data-illo="1"></div>
  <h1 data-i="app"></h1>
  <p data-i="pickSub"></p>
  <button id="pkBtn" data-i="choose"></button>
  <p class="hint" data-i="dropHint"></p>
  <p class="priv" data-i="privacy"></p>
  <p class="err" id="pkErr"></p>
  <input id="file" type="file" accept="image/*" style="display:none">
</div></div>
<div id="mark" class="screen serif s2">
  <div id="mkStage"><div id="mkWrap"><canvas id="mkPhoto"></canvas><canvas id="mkMask"></canvas><canvas id="mkOver"></canvas><div id="mkTarget"><b></b><b></b><i></i><u></u></div></div></div>
  <div id="mkSide">
    <div id="mkGuide">
      <div class="guide only2"><div class="il" data-illo="2"></div><div><p class="do" data-i="do2"></p><p class="why" data-i="why2"></p><p class="skipn" data-i="skip2"></p></div></div>
      <div class="guide only3"><div class="il" data-illo="3"></div><div><p class="do" data-i="do3"></p><p class="why" data-i="why3"></p><p class="skipn" data-i="skip3"></p></div></div>
    </div>
    <div id="mkPanel">
      <div class="row only2">
        <button class="tool on" id="tPaint" data-i="tPaint"></button><button class="tool" id="tErase" data-i="tErase"></button><button class="tool" id="tEll" data-i="tEll"></button>
      </div>
      <div class="row only2">
        <span class="lab" data-i="size"></span><input id="mkSize" type="range" min="1" max="10" step="0.5" value="4.5">
        <button class="tool" id="tUndo" data-i="tUndo"></button><button class="tool" id="tClear" data-i="tClear"></button>
      </div>
      <div class="row only3"><textarea id="mkTitle" rows="2" maxlength="60" spellcheck="false" autocomplete="off"></textarea></div>
      <div class="row only2"><button class="tool dim" id="mkBack" data-i="back"></button><button class="tool go" id="mkNext" data-i="next"></button></div>
      <div class="row only3"><button class="tool dim" id="mkBack3" data-i="back"></button><button class="tool go" id="mkGo" data-i="gen"></button></div>
    </div>
  </div>
</div>
<div id="busy" class="screen serif"><div id="busyTxt" data-i="busy"></div><div id="bar"><i></i></div></div>
<div id="steps" class="serif"><button id="st1"><b>1</b><span data-i="s1"></span></button><i></i><button id="st2"><b>2</b><span data-i="s2"></span></button><i></i><button id="st3"><b>3</b><span data-i="s3"></span></button></div>
<button id="helpBtn" class="serif">?</button>
<button id="lang" class="serif"></button>
<div id="help" class="serif"><h2 data-i="helpT"></h2>
  <div id="cards">
    <div class="card"><div class="il" data-illo="1"></div><div><h3 data-i="c1"></h3><p data-i="do1"></p><p class="why" data-i="why1"></p></div></div>
    <div class="card"><div class="il" data-illo="2"></div><div><h3 data-i="c2"></h3><p data-i="do2"></p><p class="why" data-i="why2"></p></div></div>
    <div class="card"><div class="il" data-illo="3"></div><div><h3 data-i="c3"></h3><p data-i="do3"></p><p class="why" data-i="why3"></p></div></div>
  </div>
